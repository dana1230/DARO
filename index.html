<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>다로리</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="phone-stage" aria-label="다로리 앱 미리보기">
        <div id="phone" class="phone"></div>
      </section>

      <aside class="control-panel" aria-label="화면 선택">
        <div class="brand">
          <span class="brand-mark"></span>
          <div>
            <p>다로리</p>
            <strong>텍스트 수정형 퍼블리싱</strong>
          </div>
        </div>

        <div class="panel-group">
          <p class="panel-label">주요 화면</p>
          <div class="screen-list" id="screenList"></div>
        </div>

        <div class="panel-group">
          <p class="panel-label">소원 카드</p>
          <div class="side-toggle" role="group" aria-label="카드 면 선택">
            <button class="side-button active" type="button" data-side="front">앞면</button>
            <button class="side-button" type="button" data-side="back">뒷면</button>
          </div>
          <div class="card-grid" id="cardGrid"></div>
        </div>
      </aside>
    </main>

    <script src="script.js"></script>
  </body>
</html>
