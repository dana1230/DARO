<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>다이루리 온보딩</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="phone-stage" aria-label="다이루리 온보딩 미리보기">
        <div id="phone" class="phone"></div>
      </section>

      <aside class="control-panel" aria-label="온보딩 화면 선택">
        <div class="brand">
          <span class="brand-mark"></span>
          <div>
            <p>다이루리</p>
            <strong>온보딩 4개 화면</strong>
          </div>
        </div>

        <div class="panel-group">
          <p class="panel-label">Figma 노드 기준</p>
          <div class="screen-list" id="screenList"></div>
        </div>

        <div class="panel-note">
          배경은 Figma 시안처럼 유지하고, 카드/버튼/제목/본문은 실제 텍스트 레이어로 분리했습니다.
        </div>
      </aside>
    </main>

    <script src="script.js"></script>
  </body>
</html>
